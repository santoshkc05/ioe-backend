pre-commit:
  parallel: true
  commands:
    format:
      glob: "*.go"
      run: golangci-lint fmt --diff ./...
    lint:
      glob: "*.go"
      run: golangci-lint run --new-from-rev=HEAD ./...
    secrets:
      run: go run github.com/zricethezav/gitleaks/v8@v8.30.1 git --pre-commit --staged --redact --no-banner .
