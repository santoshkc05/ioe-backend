        option_ids:
          type: array
          items: { $ref: "#/components/schemas/ID" }
        is_correct: { type: boolean }
        points_possible: { type: integer }
        points_awarded: { type: integer }
        reference_lecture_id: { $ref: "#/components/schemas/ID" }
