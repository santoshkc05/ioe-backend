    get:
      summary: List a user's purchases
      description: The user themselves or a root admin; anyone else gets 404. Newest first.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/UserID"
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 50, default: 20 } }
        - { name: cursor, in: query, required: false, schema: { type: string }, description: "`next_cursor` of the previous page" }
      responses:
        "200":
          description: A page of purchases
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchasePage" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
    post:
      summary: Record an offline payment
      description: >
        Root admin only. Creates a paid purchase under gateway `manual` for a published paid course,
        enrolls the user, and sends the payment-received email. The amount may differ from the
        course price. 403 `forbidden` for anyone else; 404 `not_found` for an unknown user or a
        missing or unpublished course; 409 `course_free` or `already_purchased`.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/UserID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ManualPurchaseRequest" }
      responses:
        "201":
          description: The recorded purchase
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurchaseResponse" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
    refreshCookie:
      type: apiKey
      in: cookie
      name: __Secure-ioe_refresh
  parameters:
    VersionQuery:
      name: version
      in: query
      required: false
      schema: { type: integer, minimum: 1 }
      description: Published version to read; managers only. Omit for the working copy (managers) or the live version (everyone else).
    View:
      name: view
      in: query
      required: false
      schema: { type: string, enum: [draft, live] }
      description: live selects the live version. draft, or no value, selects the caller's default.
    Origin:
      name: Origin
      in: header
      required: true
      description: Must exactly match a configured allowed origin.
      schema: { type: string }
    CourseID:
      name: courseID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    SectionID:
      name: sectionID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    LectureID:
      name: lectureID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    OwnerID:
      name: ownerID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    UserID:
      name: userID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    AssetID:
      name: assetID
      in: path
      required: true
      schema: { type: string, pattern: "^[0-9]+$" }
    QuizID:
      name: quizID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    ExamID:
      name: examID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    AttemptID:
      name: attemptID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
    PurchaseID:
      name: purchaseID
      in: path
      required: true
      schema: { $ref: "#/components/schemas/ID" }
  headers:
    RefreshCookie:
      description: >
        __Secure-ioe_refresh=<token>; Path=/v1/auth; Max-Age=<seconds>; HttpOnly; Secure; SameSite=Strict
      schema: { type: string }
  responses:
    Status:
      description: Health status
      content:
        application/json:
          schema:
            type: object
            properties:
              status: { type: string, enum: [ok, unavailable] }
    Problem:
      description: Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    MethodNotAllowed:
      description: Method Not Allowed
      headers:
        Allow:
          description: Allowed HTTP methods for the target resource
          required: true
          schema: { type: string }
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
    InternalError:
      description: Internal Server Error
      content:
        application/problem+json:
          schema: { $ref: "#/components/schemas/Problem" }
  schemas:
    TokenResponse:
      type: object
      required: [access_token, token_type, expires_in]
      properties:
        access_token: { type: string }
        token_type: { type: string, const: Bearer }
        expires_in: { type: integer, description: Seconds until the access token expires }
    User:
      type: object
      required: [id, email, name, avatar_url, role]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        email: { type: string, format: email }
        name: { type: string }
        avatar_url: { type: string }
        role: { type: string, enum: [student, instructor, root_admin] }
    UserList:
      type: object
      required: [users]
      properties:
        users:
          type: array
          items: { $ref: "#/components/schemas/User" }
    SetRoleRequest:
      type: object
      required: [role]
      properties:
        role: { type: string, enum: [student, instructor] }
    ID:
      type: string
      pattern: '^[1-9][0-9]{0,18}$'
      description: Snowflake ID rendered as a decimal string.
    Price:
      type: object
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 0, description: Paisa; 0 means free }
        currency: { type: string, enum: ["", NPR], description: Empty when free }
    Section:
      type: object
      required: [id, title, order]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        order: { type: integer }
    Lecture:
      type: object
      required: [id, title, has_text, has_video, free_preview, order]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        section_id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        has_text: { type: boolean }
        has_video: { type: boolean }
        free_preview: { type: boolean }
        order: { type: integer }
    Course:
      type: object
      required: [id, owner_id, title, description, status, price, is_free, sections, lectures, thumbnail_url, level, has_draft_changes, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        owner_id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        description: { type: string }
        status: { type: string, enum: [draft, in_review, approved, changes_requested, published, archived] }
        price: { $ref: "#/components/schemas/Price" }
        is_free: { type: boolean }
        sections:
          type: array
          items: { $ref: "#/components/schemas/Section" }
        lectures:
          type: array
          items: { $ref: "#/components/schemas/Lecture" }
        thumbnail_url: { type: string }
        level: { type: string, enum: ["", beginner, intermediate, advanced] }
        latest_review_note: { type: string, description: The latest reviewer note while changes are requested. Omitted when empty. }
        submitted_at: { type: string, format: date-time, description: Omitted until first submitted. }
        reviewed_at: { type: string, format: date-time, description: Omitted until first reviewed. }
        live_version_number: { type: integer, minimum: 1, description: The version readers are served. Omitted when not live. }
        live_published_at: { type: integer, format: int64, description: Unix milliseconds the live version was published. Omitted when not live. }
        has_draft_changes: { type: boolean, description: True when the course is live and the working copy is not. }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CoursePage:
      type: object
      required: [courses, total]
      properties:
        courses:
          type: array
          items: { $ref: "#/components/schemas/Course" }
        total: { type: integer }
    ApproveRequest:
      type: object
      additionalProperties: false
      properties:
        note: { type: string, maxLength: 4000 }
    ReviewNoteRequest:
      type: object
      additionalProperties: false
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 4000, description: Must not be blank. }
    CourseReview:
      type: object
      required: [id, reviewer_id, decision, note, created_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        reviewer_id: { $ref: "#/components/schemas/ID", description: The author for submitted entries; the reviewer otherwise. }
        decision: { type: string, enum: [submitted, approved, changes_requested, unpublished] }
        note: { type: string }
        created_at: { type: string, format: date-time }
    CourseVersionSummary:
      type: object
      required: [version_number, published_by, published_at]
      properties:
        version_number: { type: integer, minimum: 1 }
        published_by: { $ref: "#/components/schemas/ID" }
        published_at: { type: integer, format: int64, description: Unix milliseconds. }
    CoursePublishingSettings:
      type: object
      required: [publishing_policy]
      properties:
        publishing_policy: { type: string, enum: [review_required, independent] }
    CourseSummary:
      type: object
      required: [id, owner_id, title, description, level, thumbnail_url, price, is_free, lecture_count, section_count, created_at, updated_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        owner_id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        description: { type: string }
        level: { type: string, enum: ["", beginner, intermediate, advanced] }
        thumbnail_url: { type: string }
        price: { $ref: "#/components/schemas/Price" }
        is_free: { type: boolean }
        lecture_count: { type: integer }
        section_count: { type: integer }
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    CatalogPage:
      type: object
      required: [courses]
      properties:
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseSummary" }
        next_cursor:
          type: string
          description: Present only when another page exists. Opaque.
    Enrollment:
      type: object
      required: [id, course_id, user_id, status, enrolled_at]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        course_id: { $ref: "#/components/schemas/ID" }
        user_id: { $ref: "#/components/schemas/ID" }
        status: { type: string, enum: [active, canceled] }
        enrolled_at: { type: string, format: date-time }
        canceled_at: { type: string, format: date-time, description: Present only when canceled }
    EnrollmentPage:
      type: object
      required: [enrollments, total]
      properties:
        enrollments:
          type: array
          items: { $ref: "#/components/schemas/Enrollment" }
        total: { type: integer }
    CancelEnrollmentRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 500 }
    CheckoutRequest:
      type: object
      required: [gateway]
      properties:
        gateway: { type: string, enum: [esewa] }
    Purchase:
      type: object
      required: [id, course_id, course_title, user_id, amount_minor, currency, gateway, status, created_at, settled_at, granted, manual_method, reference, note, recorded_by]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        course_id: { $ref: "#/components/schemas/ID" }
        user_id: { $ref: "#/components/schemas/ID" }
        amount_minor: { type: integer, format: int64, minimum: 1, description: Price snapshot in the currency's minor unit }
        currency: { type: string, description: ISO 4217 code }
        gateway: { type: string, enum: [esewa, manual] }
        status: { type: string, enum: [pending, paid, failed] }
        created_at: { type: string, format: date-time }
        settled_at: { type: [string, "null"], format: date-time, description: Null while pending }
        granted: { type: boolean, description: True once the buyer is enrolled }
        course_title: { type: string, description: Course title when the purchase was made }
        manual_method: { type: [string, "null"], enum: [bank_transfer, cash, other, null] }
        reference: { type: [string, "null"], description: Voucher or receipt number; manual purchases only }
        note: { type: [string, "null"] }
        recorded_by:
          oneOf: [{ $ref: "#/components/schemas/ID" }, { type: "null" }]
          description: Root admin who recorded a manual purchase
    PurchasePage:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/Purchase" }
        next_cursor: { type: string, description: Cursor of the next page; absent on the last page }
    ManualPurchaseRequest:
      type: object
      additionalProperties: false
      required: [course_id, amount_minor, currency, method, reference]
      properties:
        course_id: { $ref: "#/components/schemas/ID" }
        amount_minor: { type: integer, format: int64, minimum: 1 }
        currency: { type: string }
        method: { type: string, enum: [bank_transfer, cash, other] }
        reference: { type: string, minLength: 1, maxLength: 200 }
        note: { type: string, maxLength: 1000 }
    Checkout:
      type: object
      required: [method, url, fields]
      properties:
        method: { type: string, enum: [POST] }
        url: { type: string, format: uri, description: Gateway form action }
        fields:
          type: object
          additionalProperties: { type: string }
          description: Form fields to post unchanged, including the signature
    CheckoutResponse:
      type: object
      required: [purchase, checkout]
      properties:
        purchase: { $ref: "#/components/schemas/Purchase" }
        checkout: { $ref: "#/components/schemas/Checkout" }
    PurchaseResponse:
      type: object
      required: [purchase]
      properties:
        purchase: { $ref: "#/components/schemas/Purchase" }
    RecordLectureProgressRequest:
      type: object
      required: [state]
      properties:
        state: { type: string, enum: [in_progress, completed] }
        position_ms: { type: integer, format: int64, minimum: 0, description: Video resume offset; 0 for text }
    LectureProgress:
      type: object
      required: [lecture_id, state, position_ms, updated_at]
      properties:
        lecture_id: { $ref: "#/components/schemas/ID" }
        state: { type: string, enum: [in_progress, completed] }
        position_ms: { type: integer, format: int64 }
        updated_at: { type: string, format: date-time }
    CourseProgress:
      type: object
      required: [course_id, user_id, completed_lecture_ids, lectures]
      properties:
        course_id: { $ref: "#/components/schemas/ID" }
        user_id: { $ref: "#/components/schemas/ID" }
        last_lecture_id:
          allOf: [{ $ref: "#/components/schemas/ID" }]
          description: Present only when something was recorded
        completed_lecture_ids:
          type: array
          items: { $ref: "#/components/schemas/ID" }
          description: May include lectures since removed from the course
        lectures:
          type: array
          items: { $ref: "#/components/schemas/LectureProgress" }
        updated_at: { type: string, format: date-time, description: Present only when something was recorded }
    ActivityDay:
      type: object
      required: [date, lecture_count]
      properties:
        date: { type: string, format: date, description: UTC date }
        lecture_count: { type: integer, description: Distinct lectures whose latest write fell on this date }
    UserProgress:
      type: object
      required: [user_id, courses, activity_days]
      properties:
        user_id: { $ref: "#/components/schemas/ID" }
        courses:
          type: array
          items: { $ref: "#/components/schemas/CourseProgress" }
        activity_days:
          type: array
          items: { $ref: "#/components/schemas/ActivityDay" }
    FlashcardCard:
      type: object
      required: [front, back]
      properties:
        client_card_id: { type: string }
        front: { type: string }
        back: { type: string }
        hint: { type: string }
        media_asset_id: { $ref: "#/components/schemas/ID" }
        alignment: { type: string }
        rotation: { type: integer }
        width: { type: integer }
        height: { type: integer }
    ContentBlock:
      type: object
      required: [id, client_block_id, type, position]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        client_block_id: { type: string }
        type: { type: string, enum: [text, video, quiz, image, flashcard] }
        position: { type: integer }
        body: { type: string }
        url: { type: string }
        duration_ms: { type: integer, format: int64 }
        quiz_id: { $ref: "#/components/schemas/ID" }
        media_asset_id: { $ref: "#/components/schemas/ID" }
        alt: { type: string }
        caption: { type: string }
        layout: { type: string, enum: [inline, wide] }
        alignment: { type: string, enum: [left, center, right] }
        rotation: { type: integer }
        width: { type: integer }
        height: { type: integer }
        mode: { type: string, enum: [steps, recall] }
        title: { type: string }
        cards:
          type: array
          items: { $ref: "#/components/schemas/FlashcardCard" }
    LectureContent:
      type: object
      required: [lecture_id, course_id, title, text_body, video_url, video_duration_ms, free_preview, content_revision, blocks]
      properties:
        lecture_id: { $ref: "#/components/schemas/ID" }
        course_id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        text_body: { type: string, description: Body of the first text block }
        video_url: { type: string, description: URL of the first video block }
        video_duration_ms: { type: integer, format: int64 }
        free_preview: { type: boolean }
        content_revision: { type: integer, format: int64 }
        blocks:
          type: array
          items: { $ref: "#/components/schemas/ContentBlock" }
    LectureContentConflict:
      description: >
        revision_conflict. Carries the winner's content as extension members; the problem
        title replaces the lecture title.
      allOf:
        - $ref: "#/components/schemas/Problem"
        - $ref: "#/components/schemas/LectureContent"
    ContentRevision:
      type: object
      required: [content_revision]
      properties:
        content_revision: { type: integer, format: int64 }
    CreateCourseRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        owner_id: { $ref: "#/components/schemas/ID" }
        title: { type: string }
        description: { type: string }
    UpdateCourseDetailsRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string }
        description: { type: string }
        thumbnail_url: { type: string }
        level: { type: string, enum: ["", beginner, intermediate, advanced] }
    SetPriceRequest:
      type: object
      additionalProperties: false
      required: [amount_minor, currency]
      properties:
        amount_minor: { type: integer, format: int64, minimum: 0 }
        currency: { type: string, enum: ["", NPR] }
    TitleRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string }
    AddLectureRequest:
      type: object
      additionalProperties: false
      required: [title]
      properties:
        title: { type: string }
        text_body: { type: string }
        video_url: { type: string }
        video_duration_ms: { type: integer, format: int64 }
    ReorderLecturesRequest:
      type: object
      additionalProperties: false
      required: [lecture_ids]
      properties:
        lecture_ids:
          type: array
          items: { $ref: "#/components/schemas/ID" }
    MoveLectureRequest:
      type: object
      additionalProperties: false
      required: [section_id]
      properties:
        section_id:
          type: string
          description: Section ID, or empty to unsection the lecture.
          pattern: '^([1-9][0-9]{0,18})?$'
    FreePreviewRequest:
      type: object
      additionalProperties: false
      required: [free_preview]
      properties:
        free_preview: { type: boolean }
    BlockInput:
      type: object
      additionalProperties: false
      required: [type]
      description: A content block. Order comes from position in the list or from the patch order, never from a position field.
      properties:
        client_block_id: { type: string }
        type: { type: string, enum: [text, video, quiz, image, flashcard] }
        body: { type: string }
        url: { type: string }
        duration_ms: { type: integer, format: int64 }
        quiz_id: { type: string }
        media_asset_id: { type: string }
        alt: { type: string }
        caption: { type: string }
        layout: { type: string }
        alignment: { type: string }
        rotation: { type: integer }
        width: { type: integer }
        height: { type: integer }
        mode: { type: string }
        title: { type: string }
        cards:
          type: array
          items: { $ref: "#/components/schemas/FlashcardCard" }
    ReplaceContentRequest:
      type: object
      additionalProperties: false
      description: >
        Either blocks (an explicit empty list clears the lecture) or the legacy
        text_body/video_url/video_duration_ms fields when blocks is absent.
      properties:
        blocks:
          type: array
          items: { $ref: "#/components/schemas/BlockInput" }
        text_body: { type: string }
        video_url: { type: string }
        video_duration_ms: { type: integer, format: int64 }
    PatchContentRequest:
      type: object
      additionalProperties: false
      required: [base_revision, order]
      description: >
        The set of ids in order must equal (existing blocks plus upserts) minus deletes.
        Limits: 500 order ids, 200 upserts, 500 deletes.
      properties:
        base_revision: { type: integer, format: int64 }
        order:
          type: array
          items: { type: string }
        upserts:
          type: array
          items: { $ref: "#/components/schemas/BlockInput" }
        deletes:
          type: array
          items: { type: string }
    CreateMediaUploadRequest:
      type: object
      additionalProperties: false
      required: [kind, content_type, filename, size_bytes]
      properties:
        kind: { type: string, enum: [video, image] }
        content_type: { type: string, description: "video/* for videos; image/jpeg, image/png or image/webp for images" }
        filename: { type: string }
        size_bytes: { type: integer, format: int64, minimum: 1 }
    MediaUploadPart:
      type: object
      required: [part_number, url]
      properties:
        part_number: { type: integer }
        url: { type: string, format: uri }
    MediaUpload:
      type: object
      required: [asset_id, expires_at]
      description: Either upload_url (one PUT) or part_size and part_urls (multipart).
      properties:
        asset_id: { type: string }
        upload_id: { type: string }
        upload_url: { type: string, format: uri }
        part_size: { type: integer, format: int64 }
        part_urls: { type: array, items: { $ref: "#/components/schemas/MediaUploadPart" } }
        expires_at: { type: string, format: date-time }
    MediaAsset:
      type: object
      required: [id, course_id, kind, status, progress_percent, updated_at]
      properties:
        id: { type: string }
        course_id: { type: string }
        kind: { type: string, enum: [video, image] }
        status: { type: string, enum: [uploading, processing, ready, failed, canceled, deleting] }
        progress_percent: { type: integer, minimum: 0, maximum: 100 }
        duration_ms: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        error_message: { type: string }
        updated_at: { type: string, format: date-time }
    MediaPlayback:
      type: object
      required: [id, kind, status]
      description: >
        URLs are present only when status is ready. A video carries playback_url (a signed HLS
        manifest) and optionally poster_url; an image carries url. URLs expire at expires_at.
      properties:
        id: { type: string }
        kind: { type: string, enum: [video, image] }
        status: { type: string }
        playback_url: { type: string, format: uri }
        url: { type: string, format: uri }
        poster_url: { type: string, format: uri }
        duration_ms: { type: integer, format: int64 }
        width: { type: integer }
        height: { type: integer }
        expires_at: { type: string, format: date-time }
    Problem:
      type: object
      required: [type, code, title, status]
      properties:
        type: { $ref: "#/components/schemas/ProblemType" }
        code:
          allOf: [{ $ref: "#/components/schemas/ProblemType" }]
          description: Same value as type, for clients that read a code member.
        title: { type: string }
        status: { type: integer }
        detail: { type: string }
        instance: { type: string, description: Request ID }
        details:
          type: object
          description: >
            Present on exam_not_open (opens_at), exam_closed (closes_at), reveal_not_yet
            (reveal_at), and edit_* codes (question_id, option_id when known).
          properties:
            opens_at: { type: string, format: date-time }
            closes_at: { type: string, format: date-time }
            reveal_at: { type: string, format: date-time }
            question_id: { $ref: "#/components/schemas/ID" }
            option_id: { $ref: "#/components/schemas/ID" }
    ProblemType:
      type: string
      enum:
        - invalid_request
        - invalid_token
        - refresh_reuse_detected
        - email_unverified
        - origin_not_allowed
        - not_found
        - method_not_allowed
        - payload_too_large
        - unsupported_media_type
        - rate_limited
        - internal
        - forbidden
        - enrollment_required
        - concurrent_modification
        - course_not_editable
        - invalid_transition
        - revision_conflict
        - lecture_content_revision_required
