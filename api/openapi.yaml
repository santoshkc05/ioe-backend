    QuizOption:
      type: object
      required: [id, label]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        label: { type: string }
    QuizQuestion:
      type: object
      required: [id, prompt, type, options, correct_option_ids, explanation]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        prompt: { type: string }
        type: { type: string, enum: [single_choice, multiple_choice, true_false] }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuizOption" }
        correct_option_ids:
          type: array
          items: { $ref: "#/components/schemas/ID" }
        explanation: { type: string }
    Quiz:
      type: object
      required: [id, lecture_id, position, revision, questions]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        lecture_id: { $ref: "#/components/schemas/ID" }
        position: { type: integer, minimum: 0 }
        revision: { type: integer, minimum: 1 }
        questions:
          type: array
          items: { $ref: "#/components/schemas/QuizQuestion" }
    SaveQuizRequest:
      type: object
      required: [position, questions]
      additionalProperties: false
      properties:
        position: { type: integer, minimum: 0, maximum: 10000 }
        questions:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            required: [prompt, type, options]
            additionalProperties: false
            properties:
              id: { type: string, description: Empty or omitted for a new question }
              prompt: { type: string, maxLength: 5000 }
              type: { type: string, enum: [single_choice, multiple_choice, true_false] }
              explanation: { type: string, maxLength: 5000 }
              points: { type: integer, minimum: 1, description: Defaults to 1 }
              reference_lecture_id: { type: string, description: Empty or omitted when absent }
              options:
                type: array
                minItems: 2
                maxItems: 10
                items:
                  type: object
                  required: [label, is_correct]
                  additionalProperties: false
                  properties:
                    id: { type: string, description: Empty or omitted for a new option }
                    label: { type: string, maxLength: 1000 }
                    is_correct: { type: boolean }
    RecordQuizAttemptRequest:
      type: object
      required: [user_id, answers]
      additionalProperties: false
      properties:
        user_id: { $ref: "#/components/schemas/ID" }
        answers:
          type: array
          items:
            type: object
            required: [question_id, option_ids]
            additionalProperties: false
            properties:
              question_id: { $ref: "#/components/schemas/ID" }
              option_ids:
                type: array
                items: { $ref: "#/components/schemas/ID" }
    QuizAttemptResult:
      type: object
      required: [id, recorded]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        recorded: { type: boolean }
    ExamSettings:
      type: object
      required: [title, description, pass_mark, time_limit_seconds, retakes_allowed, reveal_policy]
      properties:
        title: { type: string }
        description: { type: string }
        pass_mark: { type: integer, minimum: 0, maximum: 100 }
        time_limit_seconds: { type: [integer, "null"], minimum: 1, maximum: 86400, description: Null when untimed }
        retakes_allowed: { type: boolean }
        opens_at: { type: string, format: date-time, description: Absent when the exam has no opening time }
        closes_at: { type: string, format: date-time, description: Absent when the exam has no closing time }
        reveal_policy: { type: string, enum: [after_attempt, after_close, never] }
    ExamQuestion:
      type: object
      required: [id, prompt, type, points, options]
      properties:
        id: { $ref: "#/components/schemas/ID" }
        prompt: { type: string }
        type: { type: string, enum: [single_choice, multiple_choice, true_false] }
        points: { type: integer, minimum: 1 }
        options:
          type: array
          items: { $ref: "#/components/schemas/QuizOption" }
        reference_lecture_id: { $ref: "#/components/schemas/ID" }
    ExamAuthoringQuestion:
      allOf:
        - $ref: "#/components/schemas/ExamQuestion"
        - type: object
          required: [correct_option_ids, explanation]
          properties:
            correct_option_ids:
              type: array
              items: { $ref: "#/components/schemas/ID" }
            explanation: { type: string }
    Exam:
      allOf:
        - $ref: "#/components/schemas/ExamSettings"
        - type: object
          required: [id, course_id, position, revision, questions]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            course_id: { $ref: "#/components/schemas/ID" }
            position: { type: integer, minimum: 0 }
            revision: { type: integer, minimum: 1 }
            questions:
              type: array
              items: { $ref: "#/components/schemas/ExamQuestion" }
    ExamAuthoring:
      allOf:
        - $ref: "#/components/schemas/ExamSettings"
        - type: object
          required: [id, course_id, position, revision, status, questions]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            course_id: { $ref: "#/components/schemas/ID" }
            position: { type: integer, minimum: 0 }
            revision: { type: integer, minimum: 1 }
            status: { type: string, enum: [draft, published] }
            questions:
              type: array
              items: { $ref: "#/components/schemas/ExamAuthoringQuestion" }
    ExamAuthoringSummary:
      allOf:
        - $ref: "#/components/schemas/ExamSettings"
        - type: object
          required: [id, position, revision, status, question_count, total_points]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            position: { type: integer, minimum: 0 }
            revision: { type: integer, minimum: 1 }
            status: { type: string, enum: [draft, published] }
            question_count: { type: integer }
            total_points: { type: integer }
    ExamSummary:
      allOf:
        - $ref: "#/components/schemas/ExamSettings"
        - type: object
          required: [id, position, revision, question_count, total_points, availability, attempt_count]
          properties:
            id: { $ref: "#/components/schemas/ID" }
            position: { type: integer, minimum: 0 }
            revision: { type: integer, minimum: 1 }
            question_count: { type: integer }
            total_points: { type: integer }
            availability: { type: string, enum: [not_open, open, closed] }
            open_attempt_id: { $ref: "#/components/schemas/ID" }
            best_score: { type: integer, minimum: 0, maximum: 100 }
            best_passed: { type: boolean }
            attempt_count: { type: integer }
    ExamQuestionInput:
      type: object
      required: [prompt, type, options]
      additionalProperties: false
      properties:
        id: { type: string, description: Empty or omitted for a new question }
        prompt: { type: string, maxLength: 5000 }
        type: { type: string, enum: [single_choice, multiple_choice, true_false] }
        explanation: { type: string, maxLength: 5000 }
        points: { type: integer, minimum: 1, description: Defaults to 1 }
        reference_lecture_id: { type: string, description: Empty or omitted when absent }
        options:
          type: array
          minItems: 2
          maxItems: 10
          items:
            type: object
            required: [label, is_correct]
            additionalProperties: false
            properties:
              id: { type: string, description: Empty or omitted for a new option }
              label: { type: string, maxLength: 1000 }
              is_correct: { type: boolean }
    SaveExamRequest:
      type: object
      required: [title, pass_mark, reveal_policy, questions]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        position: { type: integer, minimum: 0, maximum: 10000 }
        pass_mark: { type: integer, minimum: 0, maximum: 100 }
        time_limit_seconds: { type: [integer, "null"], minimum: 1, maximum: 86400 }
        retakes_allowed: { type: boolean }
        opens_at: { type: [string, "null"], format: date-time }
        closes_at: { type: [string, "null"], format: date-time, description: Must be after opens_at; required by after_close }
        reveal_policy: { type: string, enum: [after_attempt, after_close, never] }
        questions:
          type: array
          minItems: 1
          maxItems: 100
          items: { $ref: "#/components/schemas/ExamQuestionInput" }
    SaveExamSettingsRequest:
      type: object
      required: [title, pass_mark, reveal_policy]
      additionalProperties: false
      properties:
        title: { type: string, maxLength: 200 }
        description: { type: string, maxLength: 5000 }
        pass_mark: { type: integer, minimum: 0, maximum: 100 }
        points:
          type: object
          description: Question ID to points; omitted questions keep theirs
          additionalProperties: { type: integer, minimum: 1 }
        time_limit_seconds: { type: [integer, "null"], minimum: 1, maximum: 86400 }
        retakes_allowed: { type: boolean }
        opens_at: { type: [string, "null"], format: date-time }
        closes_at: { type: [string, "null"], format: date-time }
        reveal_policy: { type: string, enum: [after_attempt, after_close, never] }
