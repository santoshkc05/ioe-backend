  /v1/courses/{courseID}/lectures/{lectureID}/content:
    get:
      summary: Read lecture content. Non-preview lectures require enrollment (enrollment_required).
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/CourseID"
        - $ref: "#/components/parameters/LectureID"
        - $ref: "#/components/parameters/View"
      description: >
        Managers get the working copy unless they ask for view=live; everyone else always gets
        the live version, whose content_revision is 0.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/LectureContent" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
    put:
      summary: Replace lecture content (blocks, or legacy text_body/video_url)
      description: >
        A media_asset_id must name an uploaded asset of this course with the block's kind
        (video for video blocks, image for image blocks and flashcard cards); otherwise
        400 invalid_media_reference. A quiz_id must name a quiz of this lecture; otherwise
        400 invalid_quiz_reference.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/CourseID"
        - $ref: "#/components/parameters/LectureID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/ReplaceContentRequest" }
      responses:
        "204": { description: No Content }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409": { $ref: "#/components/responses/Problem" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
        "429": { $ref: "#/components/responses/Problem" }
        "405": { $ref: "#/components/responses/MethodNotAllowed" }
        "500": { $ref: "#/components/responses/InternalError" }
    patch:
      summary: Patch lecture content against base_revision; a stale base_revision is revision_conflict
      description: >
        A media_asset_id must name an uploaded asset of this course with the block's kind
        (video for video blocks, image for image blocks and flashcard cards); otherwise
        400 invalid_media_reference. A quiz_id must name a quiz of this lecture; otherwise
        400 invalid_quiz_reference.
      security:
        - bearer: []
      parameters:
        - $ref: "#/components/parameters/CourseID"
        - $ref: "#/components/parameters/LectureID"
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PatchContentRequest" }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ContentRevision" }
        "400": { $ref: "#/components/responses/Problem" }
        "401": { $ref: "#/components/responses/Problem" }
        "403": { $ref: "#/components/responses/Problem" }
        "404": { $ref: "#/components/responses/Problem" }
        "409":
          description: revision_conflict; the body carries the winning lecture content
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/LectureContentConflict" }
        "413": { $ref: "#/components/responses/Problem" }
        "415": { $ref: "#/components/responses/Problem" }
