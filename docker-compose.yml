name: ioe-backend

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ioe
      POSTGRES_USER: ioe
      POSTGRES_PASSWORD: ioe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioe -d ioe"]
      interval: 2s
      timeout: 3s
      retries: 30

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - o2data:/data

  mailpit:
    profiles: [app]
    image: axllent/mailpit:v1.27.8
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  notification-db-setup:
    profiles: [app]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      PGPASSWORD: ioe
    command: ["psql", "-h", "postgres", "-U", "ioe", "-d", "ioe", "-v", "ON_ERROR_STOP=1", "-f", "/setup/notification-db-setup.sql"]
    volumes:
      - ./compose/notification-db-setup.sql:/setup/notification-db-setup.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  notification-migrate:
    profiles: [app]
    build: ../notification
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://notification:notification-local-dev@postgres:5432/ioe?sslmode=disable
    depends_on:
      notification-db-setup:
        condition: service_completed_successfully

  notification:
    profiles: [app]
    build: ../notification
    command: ["serve"]
    environment:
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: postgres://notification:notification-local-dev@postgres:5432/ioe?sslmode=disable
      # Local-only keys, documented in ../notification/README.md.
      NOTIFICATION_SEND_API_KEYS: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M
      NOTIFICATION_READ_API_KEYS: cnJycnJycnJycnJycnJycnJycnJycnJycnJycnJycnI
      PUSH_ENABLED: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: notifications@ioe.test
      SMTP_FROM_NAME: IOE
      SMTP_MESSAGE_ID_DOMAIN: mail.ioe.test
      SMTP_TLS_MODE: insecure
      ALLOW_INSECURE_SMTP: "true"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  media-db-setup:
    profiles: [app]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      PGPASSWORD: ioe
    command: ["psql", "-h", "postgres", "-U", "ioe", "-d", "ioe", "-v", "ON_ERROR_STOP=1", "-f", "/setup/media-db-setup.sql"]
    volumes:
      - ./compose/media-db-setup.sql:/setup/media-db-setup.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  minio:
    profiles: [app]
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: mediaadmin
      MINIO_ROOT_PASSWORD: media-local-dev
      MINIO_API_CORS_ALLOW_ORIGIN: http://localhost:5173,http://localhost:5174,http://localhost:3000
    ports:
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 2s
      timeout: 3s
      retries: 30

  minio-init:
    profiles: [app]
    image: minio/mc:RELEASE.2025-07-21T05-28-08Z
    entrypoint:
      - /bin/sh
      - -c
      - mc alias set local http://minio:9000 mediaadmin media-local-dev && mc mb --ignore-existing local/media
    depends_on:
      minio:
        condition: service_healthy

  media:
    profiles: [app]
    build: ../hitox-media-service
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://media_service:media-local-dev@postgres:5432/ioe?sslmode=disable
      DATABASE_SCHEMA: media_service
      AUTO_MIGRATE: "true"
      SNOWFLAKE_NODE_ID: "0"
      # Local-only keys.
      MEDIA_API_KEY: local-media-api-key-change-me-32-bytes
      MEDIA_DELIVERY_SECRET: local-media-delivery-secret-change-me-32
      DEFAULT_NAMESPACE_ID: ioe
      CORS_ALLOWED_ORIGINS: http://localhost:5173,http://localhost:5174,http://localhost:3000
      OBJECT_STORAGE_ENDPOINT: minio:9000
      OBJECT_STORAGE_PUBLIC_URL: http://localhost:9000/media
      OBJECT_STORAGE_ACCESS_KEY: mediaadmin
      OBJECT_STORAGE_SECRET_KEY: media-local-dev
      OBJECT_STORAGE_BUCKET: media
      OBJECT_STORAGE_REGION: us-east-1
      OBJECT_STORAGE_USE_SSL: "false"
      OBJECT_STORAGE_AUTO_CREATE_BUCKET: "false"
      MEDIA_WORKER_ENABLED: "true"
    ports:
      - "127.0.0.1:8082:8080"
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:8080/readyz"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      media-db-setup:
        condition: service_completed_successfully
      minio-init:
        condition: service_completed_successfully

  migrate:
    profiles: [app]
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://ioe:ioe@postgres:5432/ioe?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ioe:ioe@postgres:5432/ioe?sslmode=disable
      HTTP_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      NOTIFICATION_SERVICE_BASE_URL: http://notification:8080
      NOTIFICATION_SERVICE_SEND_API_KEY: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M
      MEDIA_SERVICE_BASE_URL: http://media:8080
      MEDIA_SERVICE_PUBLIC_URL: http://localhost:8082
      MEDIA_SERVICE_API_KEY: local-media-api-key-change-me-32-bytes
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      openobserve:
        condition: service_started
      notification:
        condition: service_healthy
      media:
        condition: service_healthy

volumes:
  pgdata:
  o2data:
  miniodata:
