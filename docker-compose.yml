name: ioe-backend

services:
  postgres:
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      POSTGRES_DB: ioe
      POSTGRES_USER: ioe
      POSTGRES_PASSWORD: ioe
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ioe -d ioe"]
      interval: 2s
      timeout: 3s
      retries: 30

  openobserve:
    image: public.ecr.aws/zinclabs/openobserve:v1.0.4
    environment:
      ZO_ROOT_USER_EMAIL: ${ZO_ROOT_USER_EMAIL:-root@example.com}
      ZO_ROOT_USER_PASSWORD: ${ZO_ROOT_USER_PASSWORD:-Complexpass#123}
      ZO_DATA_DIR: /data
    ports:
      - "127.0.0.1:5080:5080"
    volumes:
      - o2data:/data

  mailpit:
    profiles: [app]
    image: axllent/mailpit:v1.31.3
    ports:
      - "127.0.0.1:8025:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 2s
      timeout: 3s
      retries: 20

  notification-db-setup:
    profiles: [app]
    image: postgres:17-alpine@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24
    environment:
      PGPASSWORD: ioe
    command: ["psql", "-h", "postgres", "-U", "ioe", "-d", "ioe", "-v", "ON_ERROR_STOP=1", "-f", "/setup/notification-db-setup.sql"]
    volumes:
      - ./compose/notification-db-setup.sql:/setup/notification-db-setup.sql:ro
    depends_on:
      postgres:
        condition: service_healthy

  notification-migrate:
    profiles: [app]
    build: ../notification
    command: ["migrate"]
    environment:
      DATABASE_URL: postgres://notification:notification-local-dev@postgres:5432/ioe?sslmode=disable
    depends_on:
      notification-db-setup:
        condition: service_completed_successfully

  notification:
    profiles: [app]
    build: ../notification
    command: ["serve"]
    environment:
      HTTP_ADDRESS: ":8080"
      DATABASE_URL: postgres://notification:notification-local-dev@postgres:5432/ioe?sslmode=disable
      # Local-only keys, documented in ../notification/README.md.
      NOTIFICATION_SEND_API_KEYS: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M
      NOTIFICATION_READ_API_KEYS: cnJycnJycnJycnJycnJycnJycnJycnJycnJycnJycnI
      PUSH_ENABLED: "false"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM_ADDRESS: notifications@ioe.test
      SMTP_FROM_NAME: IOE
      SMTP_MESSAGE_ID_DOMAIN: mail.ioe.test
      SMTP_TLS_MODE: insecure
      ALLOW_INSECURE_SMTP: "true"
      LOG_LEVEL: info
    ports:
      - "127.0.0.1:8081:8080"
    depends_on:
      notification-migrate:
        condition: service_completed_successfully
      mailpit:
        condition: service_healthy

  migrate:
    profiles: [app]
    build: .
    command: ["migrate", "up"]
    environment:
      DATABASE_URL: postgres://ioe:ioe@postgres:5432/ioe?sslmode=disable
    depends_on:
      postgres:
        condition: service_healthy

  api:
    profiles: [app]
    build: .
    env_file: .env
    environment:
      DATABASE_URL: postgres://ioe:ioe@postgres:5432/ioe?sslmode=disable
      HTTP_ADDR: ":8080"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://openobserve:5080/api/default
      NOTIFICATION_SERVICE_BASE_URL: http://notification:8080
      NOTIFICATION_SERVICE_SEND_API_KEY: c3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3M
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      migrate:
        condition: service_completed_successfully
      openobserve:
        condition: service_started
      notification:
        condition: service_healthy

volumes:
  pgdata:
  o2data:
