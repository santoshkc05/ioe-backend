version: "2"
sql:
  - engine: postgresql
    schema: migrations
    queries: internal/identity/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: internal/identity/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
          - db_type: citext
            go_type: string
        rename:
          avatar_url: AvatarURL
          ip: IP
  - engine: postgresql
    schema: migrations
    queries: internal/courseauthoring/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: internal/courseauthoring/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: jsonb
            go_type: encoding/json.RawMessage
          - column: courseauthoring.lectures.section_id
            go_type:
              type: int64
              pointer: true
  - engine: postgresql
    schema: migrations
    queries: internal/enrollment/adapters/postgres/queries.sql
    gen:
      go:
        package: sqlcgen
        out: internal/enrollment/adapters/postgres/sqlcgen
        sql_package: pgx/v5
        overrides:
          - db_type: timestamptz
            go_type: time.Time
          - db_type: timestamptz
            nullable: true
            go_type:
              import: time
              type: Time
              pointer: true
