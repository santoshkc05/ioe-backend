version: "2"

run:
  timeout: 5m
  build-tags:
    - integration

linters:
  default: none
  enable:
    - bodyclose
    - contextcheck
    - depguard
    - errcheck
    - errorlint
    - gocritic
    - gosec
    - govet
    - ineffassign
    - misspell
    - noctx
    - revive
    - sqlclosecheck
    - staticcheck
    - unused
  settings:
    depguard:
      rules:
        platform-independent-of-contexts:
          list-mode: lax
          files:
            - "**/internal/platform/**"
          deny:
            - pkg: github.com/santoshkc2200/ioe-backend/internal/identity
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/notification
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/courseauthoring
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/enrollment
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/progress
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/media
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/assessment
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/payment
              desc: platform must not depend on bounded contexts
            - pkg: github.com/santoshkc2200/ioe-backend/internal/blog
              desc: platform must not depend on bounded contexts
        platform-contentblocks:
          list-mode: strict
          files:
            - "**/internal/platform/contentblocks/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/microcosm-cc/bluemonday
            - golang.org/x/net/html
            - github.com/santoshkc2200/ioe-backend/internal/platform/id
        identity-domain:
          list-mode: strict
          files:
            - "**/internal/identity/domain/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/santoshkc2200/ioe-backend/internal/platform/auth
            - github.com/santoshkc2200/ioe-backend/internal/platform/id
        identity-app:
          list-mode: strict
          files:
            - "**/internal/identity/app/**"
            - "!$test"
          allow:
            - $gostd
            - github.com/santoshkc2200/ioe-backend/internal/identity/domain
            - github.com/santoshkc2200/ioe-backend/internal/platform/auth
            - github.com/santoshkc2200/ioe-backend/internal/platform/clock
            - github.com/santoshkc2200/ioe-backend/internal/platform/id
        identity-independent:
          list-mode: lax
          files:
            - "**/internal/identity/**"
          deny:
            - pkg: github.com/santoshkc2200/ioe-backend/internal/notification
              desc: bounded contexts must not import each other
