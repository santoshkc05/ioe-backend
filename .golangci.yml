              desc: bounded contexts must not import each other
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - std-error-handling
    rules:
      # Test helpers use httptest.NewRequest and fixed credentials by design;
      # behavior is asserted by the tests themselves.
      - linters: [noctx, gosec]
        path: _test\.go$
      # The cmd/api e2e client helper closes response bodies internally
      # (defer inside client.do); bodyclose cannot see through the helper.
      - linters: [bodyclose]
        path: cmd/api/e2e_integration_test\.go$
      - linters: [staticcheck]
        path: _test\.go$
        text: SA1019

formatters:
  enable:
    - gofmt
    - goimports
  settings:
    goimports:
      local-prefixes:
        - github.com/santoshkc2200/ioe-backend
